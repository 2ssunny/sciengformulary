name: validate-catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job name is the status check to mark as required in branch protection.
  validate-catalog:
    name: validate-catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Oldest version allowed by requires-python in pyproject.toml.
          python-version: "3.10"

      - name: Install package
        run: python -m pip install .

      - name: Validate catalog
        # Run outside the checkout so the installed package is imported, not src/.
        # Checks references, registration, serialization and every numerical verification
        # case. No network access: source websites being down must not fail a valid PR.
        working-directory: ${{ runner.temp }}
        run: python -m sciengformulary.validation

      - name: Run unit tests
        # Input-domain and extra numerical checks (standard library unittest). src/ is not on
        # the path, so the tests import the installed package.
        run: python -m unittest discover -s tests -v
